name: CSS 1.0.380 experimental shutdown probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: css-1380-shutdown-probe
  cancel-in-progress: false
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Keep source line endings deterministic
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout reviewed build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact upstream source and recursive dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          repository: roflmuffin/CounterStrikeSharp
          ref: 2273dd1631a5719f2cacc6e9abbf67ac0bc30bc0
          path: upstream
          submodules: recursive
          persist-credentials: false
      - name: Build native diagnostic candidate
        shell: pwsh
        run: ./harness/ci/build.ps1 -Source ./upstream -Output ./bundle
      - name: Upload candidate and provenance (one day)
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: css-1.0.380-shutdown-diag-2273dd1-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
      - name: Record GitHub artifact digest
        shell: pwsh
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: '"Artifact SHA-256: $env:ARTIFACT_DIGEST" >> $env:GITHUB_STEP_SUMMARY'
